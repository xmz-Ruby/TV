pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        jcenter()
        google()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        jcenter()
        google()
        flatDir {
            dirs "$rootDir/app/libs", "$rootDir/quickjs/libs"
        }
        maven {
            url "https://jitpack.io"
        }
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true
        }
    }
}

// Set properties required by media3 modules
gradle.ext.androidxMediaSettingsDir = file('../media').canonicalPath

include ':app'
include ':hook'
include ':tvbus'
include ':zlive'
include ':catvod'
include ':pyramid'
include ':quickjs'
include ':thunder'
include ':youtube'
include ':jianpian'
include ':forcetech'
include ':ijkplayer'

